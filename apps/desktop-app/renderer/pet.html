<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Agent Pet</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: transparent;
        font: 12px/1.5 ui-sans-serif, system-ui, sans-serif;
        color: #e6e9f0;
        -webkit-app-region: drag;
      }
      #stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
      canvas#live2d { position: absolute; inset: 0; width: 100%; height: 100%; }
      canvas#fallback { position: absolute; inset: 0; width: 100%; height: 100%; }
      #bubble {
        position: absolute; top: 6%; left: 50%; transform: translateX(-50%);
        max-width: 85%; padding: 8px 12px; border-radius: 11px;
        background: rgba(16, 21, 32, .93); border: 1px solid rgba(110, 168, 254, .4);
        white-space: pre-wrap; opacity: 0; transition: opacity .18s ease; pointer-events: none;
        font-size: 12px;
      }
      #bubble.on { opacity: 1; }
      #state {
        position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
        font: 10px ui-monospace, monospace; color: #8896ad;
        background: rgba(16, 21, 32, .8); padding: 2px 8px; border-radius: 4px;
      }
      #note { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font: 10px ui-monospace, monospace; color: #5c6a80; text-align: center; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="live2d"></canvas>
      <canvas id="fallback" width="360" height="420"></canvas>
      <div id="bubble"></div>
      <div id="note"></div>
      <div id="state">idle</div>
    </div>

    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="./live2d-bundle.js"></script>
    <script type="module" src="./pet.js"></script>
  </body>
</html>
